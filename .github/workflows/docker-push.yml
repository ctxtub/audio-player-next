# GitHub Action：推送镜像到 GHCR
name: Docker Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  # 任务10质量门（同 workflow needs 语义）：GitHub needs 跨 workflow 不生效，
  # 故在本文件内定义 quality job 供镜像 job 同 SHA 依赖；原 push/tags/dispatch
  # 触发语义保留。workflow_run + 成功判定替代方案已评估未采用（会改变触发语义），限制如实记录。
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Detect tooling-changes (path-filter)
        run: |
          echo "检测 tooling 敏感路径（path-filter 步骤级阻断语义）…"
          echo "敏感路径：scripts/** .github/workflows/** tests/tooling/** prisma/schema.prisma"
          CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
          if [ -z "${CHANGED}" ]; then
            CHANGED="$(git status --porcelain 2>/dev/null || true)"
          fi
          echo "${CHANGED}"
          HIT="false"
          echo "${CHANGED}" | grep -E -q '^(scripts/|\.github/workflows/|tests/tooling/|prisma/schema\.prisma)' && HIT="true" || true
          if [ "${HIT}" = "true" ]; then
            echo "命中 tooling 路径，执行强制门 yarn test:tooling"
            yarn test:tooling
          else
            echo "未命中 tooling 路径，跳过强制门"
          fi

      - name: Static check
        run: yarn test:static

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn tsc --noEmit --incremental false

      - name: L1 unit tests
        run: yarn test:unit

      - name: L2 integration tests
        run: yarn test:integration

      - name: Contract (transitional NOT_APPLICABLE)
        run: |
          echo "NOT_APPLICABLE"
          exit 0

      - name: Build
        run: yarn build

  docker-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Send Bark start notification
        env:
          BARK_WEBHOOK: ${{ secrets.BARK_WEBHOOK }}
        run: |
          if [ -z "${BARK_WEBHOOK}" ]; then
            echo "BARK_WEBHOOK 未配置，跳过开始通知"
            exit 0
          fi
          MESSAGE_TITLE="Docker镜像 编译开始"
          REPO_NAME=$(basename "${GITHUB_REPOSITORY}")
          COMMIT_ID=$(echo "${GITHUB_SHA}" | cut -c1-7)
          MESSAGE_BODY="仓库：${REPO_NAME} 分支/标签：${GITHUB_REF_NAME} 提交：${COMMIT_ID}"
          ENCODED_TITLE=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "${MESSAGE_TITLE}")
          ENCODED_BODY=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "${MESSAGE_BODY}")
          curl -sS "${BARK_WEBHOOK}/${ENCODED_TITLE}/${ENCODED_BODY}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Push image via script
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          chmod +x scripts/push-ghcr.sh
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ./scripts/push-ghcr.sh "${{ github.ref_name }}"
          else
            ./scripts/push-ghcr.sh "latest"
          fi

  notify:
    needs: docker-push
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send Bark notification
        env:
          BARK_WEBHOOK: ${{ secrets.BARK_WEBHOOK }}
        run: |
          if [ -z "${BARK_WEBHOOK}" ]; then
            echo "BARK_WEBHOOK 未配置，跳过完成通知"
            exit 0
          fi
          STATUS="${{ needs.docker-push.result }}"
          if [ "${STATUS}" = "success" ]; then
            MESSAGE_TITLE="Docker镜像 推送成功"
          else
            MESSAGE_TITLE="Docker镜像 推送失败"
          fi
          REPO_NAME=$(basename "${GITHUB_REPOSITORY}")
          COMMIT_ID=$(echo "${GITHUB_SHA}" | cut -c1-7)
          MESSAGE_BODY="仓库：${REPO_NAME} 分支/标签：${GITHUB_REF_NAME} 提交：${COMMIT_ID}"
          ENCODED_TITLE=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "${MESSAGE_TITLE}")
          ENCODED_BODY=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "${MESSAGE_BODY}")
          curl -sS "${BARK_WEBHOOK}/${ENCODED_TITLE}/${ENCODED_BODY}"
