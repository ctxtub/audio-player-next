# 浏览器冒烟门（P0 Chromium + WebKit 双项目，retries=0 硬门）。
#
# 与质量/镜像发布的关系（WS2 单一发布者）：
# - 本 workflow 内：browser-smoke 同 workflow needs quality（同 SHA 质量门）。
# - 与镜像发布：唯一发布者为 docker-push.yml（docker-push job，需同文件 quality+tier-gate+browser-smoke 全绿）；
#   普通分支 checks-only（见 candidate-quality.yml），本 workflow 不发布任何镜像。
# - 本 workflow 不发布任何镜像（无 packages:write，无 docker 步骤），只做门禁。
name: Browser Smoke (P0)

on:
  push:
    branches:
      - main
      - 'candidate/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 2026-09-10 supply-chain-pin

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0 2026-09-10 supply-chain-pin
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Static check
        run: yarn test:static

      - name: Lint
        run: yarn lint

      - name: Generate Next.js type definitions
        run: npx next typegen

      - name: Typecheck
        run: yarn tsc --noEmit --incremental false

      - name: L1 unit tests
        run: yarn test:unit

      - name: L2 integration tests
        run: yarn test:integration

      - name: Contract (transitional NOT_APPLICABLE)
        run: |
          echo "NOT_APPLICABLE"
          exit 0

      - name: Build
        run: yarn build

  browser-smoke:
    name: P0 Browser Smoke (Chromium + WebKit, retries=0)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 2026-09-10 supply-chain-pin

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0 2026-09-10 supply-chain-pin
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers (chromium + webkit)
        run: npx playwright install --with-deps chromium webkit

      - name: P0 browser smoke (retries=0, isolated harness)
        env:
          BROWSER_RUN_ID: ci-browser-smoke-${{ github.sha }}
        run: yarn test:browser:smoke
