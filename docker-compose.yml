services:
  web:
    image: ghcr.io/ctxtub/audio-player-next:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # M8-05-04 canonical enable gate（构建期；默认空 = fail-closed 关闭。
        # 安全开启：NEXT_PUBLIC_CANONICAL_AUDIO_ENABLED=1 docker compose build）
        NEXT_PUBLIC_CANONICAL_AUDIO_ENABLED: "${NEXT_PUBLIC_CANONICAL_AUDIO_ENABLED:-}"
        # M9-C1 T3 单轨 build flag（默认空 = fail-closed；与 runtime 变量需同时为 1）。
        NEXT_PUBLIC_SINGLE_TRACK_AUDIO_ENABLED: "${NEXT_PUBLIC_SINGLE_TRACK_AUDIO_ENABLED:-}"
    env_file:
      - .env.local
    ports:
      - "38080:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/app/data/app.db"
      AUDIO_STORAGE_DRIVER: "local"
      AUDIO_LOCAL_ROOT: "/app/audio"
      # M8-05-04 canonical enable gate（运行时；默认空 = fail-closed 关闭。
      # server 兼容可保留 CANONICAL_AUDIO_ENABLED=1，但不能替代 client build flag；
      # 浏览器 provider 的 production rollout 必须在 build 时设置 NEXT_PUBLIC_CANONICAL_AUDIO_ENABLED=1，
      # 运行时变量单独不足以开启生产播放。语义见 lib/audio/canonicalFlag.ts）
      CANONICAL_AUDIO_ENABLED: "${CANONICAL_AUDIO_ENABLED:-}"
      # M9-C1 T3 单轨运行时门（默认空 = fail-closed；控制 server 单轨路径，
      # 需与 build 变量 NEXT_PUBLIC_SINGLE_TRACK_AUDIO_ENABLED 同时为 1）。
      SINGLE_TRACK_AUDIO_ENABLED: "${SINGLE_TRACK_AUDIO_ENABLED:-}"
    volumes:
      - ./data:/app/data
      - ./audio:/app/audio
    restart: unless-stopped
