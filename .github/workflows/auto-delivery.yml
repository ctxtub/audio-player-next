# 自动交付链（全仓唯一 workflow，用户决策 2026-09-11 轻量政策）。
#
# 触发：仅 main push（allowlist 恰为 {push}）。无 pull_request / pull_request_target / schedule /
# tag / workflow_dispatch / workflow_call / workflow_run / release——
# 多入口会产生可并发的第二条链，与“恰好一条串行链”矛盾，故全部不设。
# 失败重跑用 GitHub Re-run；同提交重跑用空提交 push，保证每次交付都过完整 quality 门。
#
# 链：quality（fail-closed）→ publish（GHCR 不可变 sha 标签）→ notify（Bark，always）。
# 标签：只发 sha-<short> 不可变标签（与生产既有 sha-e5f41be 约定一致），不发任何移动标签
# （不发 main、不发 latest），旧产物一直在 registry 可取。
# Bark 语义 warn-only：通知传输失败只记 warning，不翻转交付结论（见 notify job 注释）。
# 范围：本链只负责发布镜像，不做上线动作；服务端已有机制自动跟进新镜像，本链不触达生产。
name: Auto Delivery (main)

'on':
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: auto-delivery-main
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 2026-09-11 supply-chain-pin（API 已验真）

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0 2026-09-11 supply-chain-pin（API 已验真）
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify action pin SHAs (supply chain, fail-closed)
        run: node scripts/verify-action-pins.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Static check
        run: yarn test:static

      - name: Lint
        run: yarn lint

      - name: Generate Next.js type definitions
        run: npx next typegen

      - name: Typecheck
        run: yarn tsc --noEmit --incremental false

      - name: L1 unit tests
        run: yarn test:unit

      - name: L2 integration tests
        run: yarn test:integration

      # 中文注释：无条件全量跑 test:tooling，不做 path-filter 抽查——交付链结论必须与守卫测试结论一致，
      # “未命中 tooling 路径就跳过”是旧链弱化，本链不接受。
      - name: Tooling guard tests
        run: yarn test:tooling

      - name: Build
        run: yarn build

  publish:
    name: Build and push image to GHCR
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 2026-09-11 supply-chain-pin（API 已验真）

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0 2026-09-11 supply-chain-pin（API 已验真）

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0 2026-09-11 supply-chain-pin（API 已验真）
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # 中文注释：无参数调用 = 只发 sha-<short> 不可变标签（脚本既有语义：空 tag 即 sha-only）。
      # 不传 ref 名，不造任何移动标签；脚本内另有 latest 字面守卫。
      - name: Push immutable image via script (sha tag only, never floating)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/push-ghcr.sh
          echo "sha=${{ github.sha }} (sha-only, no floating tag)"
          ./scripts/push-ghcr.sh

  notify:
    name: Bark notification (always)
    needs: [quality, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # 中文注释：Bark 语义 warn-only：curl 失败只记 ::warning::，
      # 不翻转交付结论——通知是可观察性旁路，Bark 抖动不得把成功发布标红；
      # 失败标题已尽力送出，warning 注解保证可见。无 BARK_WEBHOOK 则跳过提示，exit 0。
      - name: Send Bark notification (warn-only transport)
        env:
          BARK_WEBHOOK: ${{ secrets.BARK_WEBHOOK }}
        run: |
          if [ -z "${BARK_WEBHOOK}" ]; then
            echo "BARK_WEBHOOK 未配置，跳过 Bark 通知（去仓库 Settings → Secrets and variables → Actions 新建同名 secret 后续链即恢复通知）。"
            exit 0
          fi
          STATUS="${{ needs.publish.result }}"
          if [ "${STATUS}" = "success" ]; then
            MESSAGE_TITLE="镜像发布 推送成功"
          else
            MESSAGE_TITLE="镜像发布 推送失败"
          fi
          REPO_NAME=$(basename "${GITHUB_REPOSITORY}")
          COMMIT_ID=$(echo "${GITHUB_SHA}" | cut -c1-7)
          MESSAGE_BODY="仓库：${REPO_NAME} 分支：${GITHUB_REF_NAME} 提交：${COMMIT_ID} 结论：${STATUS}"
          ENCODED_TITLE=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "${MESSAGE_TITLE}")
          ENCODED_BODY=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "${MESSAGE_BODY}")
          curl -fsS --max-time 15 "${BARK_WEBHOOK}/${ENCODED_TITLE}/${ENCODED_BODY}" \
            || echo "::warning::Bark 通知传输失败（不翻转交付结论）：${MESSAGE_TITLE} ${COMMIT_ID}"
