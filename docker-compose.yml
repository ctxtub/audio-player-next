services:
  web:
    image: ghcr.io/ctxtub/audio-player-next:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - "38080:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/app/data/app.db"
      AUDIO_STORAGE_DRIVER: "local"
      AUDIO_LOCAL_ROOT: "/app/audio"
    volumes:
      - ./data:/app/data
      - ./audio:/app/audio
    restart: unless-stopped
