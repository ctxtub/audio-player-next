# 普通分支质量门（checks-only，无镜像）：普通分支 push / PR 只做检查，不产镜像；发布权唯一收归 docker-push.yml。
name: Candidate Quality Gate

on:
  push:
    branches:
      - main
      - 'candidate/**'
      - 'release/**'
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 2026-09-10 supply-chain-pin
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0 2026-09-10 supply-chain-pin
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Detect tooling-changes (path-filter)
        run: |
          echo "检测 tooling 敏感路径（path-filter 步骤级阻断语义，GitHub paths 仅触发过滤故此处步骤级阻断）…"
          echo "敏感路径：scripts/** .github/workflows/** tests/tooling/** prisma/schema.prisma"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
          fi
          if [ -z "${CHANGED}" ]; then
            CHANGED="$(git status --porcelain 2>/dev/null || true)"
          fi
          echo "${CHANGED}"
          HIT="false"
          echo "${CHANGED}" | grep -E -q '^(scripts/|\.github/workflows/|tests/tooling/|prisma/schema\.prisma)' && HIT="true" || true
          if [ "${HIT}" = "true" ]; then
            echo "命中 tooling 路径，执行强制门 yarn test:tooling"
            yarn test:tooling
          else
            echo "未命中 tooling 路径，跳过强制门"
          fi

      - name: Static check
        run: yarn test:static

      - name: Lint
        run: yarn lint

      - name: Generate Next.js type definitions
        run: npx next typegen

      - name: Typecheck
        run: yarn tsc --noEmit --incremental false

      - name: L1 unit tests
        run: yarn test:unit

      - name: L2 integration tests
        run: yarn test:integration

      - name: Contract (transitional NOT_APPLICABLE)
        run: |
          echo "NOT_APPLICABLE"
          exit 0

      - name: Build
        run: yarn build

      - name: P0 browser smoke (Chromium + WebKit, retries=0)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/candidate/') || startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch'
        run: |
          npx playwright install --with-deps chromium webkit
          yarn test:browser:smoke
        env:
          BROWSER_RUN_ID: ci-candidate-${{ github.sha }}
